<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎使用Gemini-Cli-2API</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="left-section">
            <img src="/static/images/promo-image.png" alt="Gemini-Cli-2API" onerror="this.style.display='none'">
        </div>
        <div class="right-section">
            <h1 class="login-title">·欢迎使用Gemini-Cli-2API·</h1>
            <input type="password" class="password-input" id="passwordInput" placeholder="请输入密码" onkeypress="handleKeyPress(event)">
            <button class="login-button" id="loginButton" onclick="handleLogin()">登录</button>
            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
